<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tabungan Kelompok</title>
    <link rel="shortcut icon" href="assets/icon1.png" type="image/x-icon">
    <link rel="icon" href="assets/icon1.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/icon1.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 h-screen flex flex-col justify-center items-center p-6">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8 flex flex-col items-center border border-gray-100">
        <!-- Logo -->
        <img src="https://drive.google.com/thumbnail?id=1-kyhtZRrtusRkiPwNlELIJuTZlkwOic8&sz=w400" alt="Logo Tabungan" class="w-28 h-28 mb-4 object-contain">
       <!DOCTYPE html>
<html lang="id">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-extrabold text-gray-800">Selamat Datang</h1>
            <p class="text-gray-500 text-sm mt-1">Silakan login untuk mengelola tabungan Murobbi.</p>
        </div>
        
        <form id="form-login" class="w-full space-y-4" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Username</label>
                <input type="text" id="input-username" required placeholder="Masukkan username" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm font-medium">
            </div>
            
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="input-password" required placeholder="Masukkan password" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm font-medium">
            </div>
            
            <!-- CHECKBOX TETAP MASUK -->
            <div class="flex items-center mt-2 pl-1">
                <input type="checkbox" id="keep-logged-in" class="w-4 h-4 text-indigo-600 bg-gray-100 border-gray-300 rounded focus:ring-indigo-500 cursor-pointer">
                <label for="keep-logged-in" class="ml-2 text-xs font-semibold text-gray-500 cursor-pointer">Tetap masuk selama 30 hari</label>
            </div>
            
            <button type="submit" id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl mt-4 shadow-lg shadow-indigo-200 active:scale-95 transition-all flex justify-center items-center gap-2">
                <span>Login Sekarang</span>
            </button>
            
            <p id="login-error" class="text-red-500 text-xs text-center font-bold mt-3 hidden bg-red-50 p-2 rounded-lg"></p>
        </form>
    </div>

    <script>
        const API_URL = 'api.php';

        // Proteksi Sesi: Jika token lokal valid, langsung diarahkan ke beranda
        if (localStorage.getItem('kas_token') && localStorage.getItem('kas_user')) {
            window.location.href = 'index.html';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('input-username').value;
            const p = document.getElementById('input-password').value;
            const btn = document.getElementById('btn-login');
            const err = document.getElementById('login-error');
            
            btn.innerHTML = "Memproses...";
            btn.disabled = true;
            err.classList.add('hidden');

            try {
                const res = await fetch(`${API_URL}?action=login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    // Simpan data login di Local Storage
                    localStorage.setItem('kas_token', data.token);
                    localStorage.setItem('kas_user', JSON.stringify(data.user));
                    
                    // Arahkan ke halaman utama
                    window.location.href = 'index.html';
                } else {
                    err.textContent = data.message;
                    err.classList.remove('hidden');
                }
            } catch (error) {
                err.textContent = "Gagal terhubung ke server database.";
                err.classList.remove('hidden');
            } finally {
                btn.innerHTML = "Login Sekarang";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
